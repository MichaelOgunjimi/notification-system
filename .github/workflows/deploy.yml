name: Deploy

# After CI passes on main, call the project's Openship incoming deploy hook.
# The hook is served by the Openship desktop app on the maintainer's Mac and is only
# reachable over Tailscale (tailscale serve, port 10000), so the runner joins the tailnet
# as tag:ci first. The Mac must be on with the app open.
# Without the secrets below this workflow skips quietly.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secrets
        id: check
        env:
          URL: ${{ secrets.OPENSHIP_HOOK_URL }}
          TOKEN: ${{ secrets.OPENSHIP_HOOK_TOKEN }}
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ] || [ -z "$TS_ID" ] || [ -z "$TS_SECRET" ]; then
            echo "Openship hook or Tailscale secrets not set; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet
        if: steps.check.outputs.run == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Openship deploy
        if: steps.check.outputs.run == 'true'
        env:
          HOOK_URL: ${{ secrets.OPENSHIP_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.OPENSHIP_HOOK_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $HOOK_TOKEN" "$HOOK_URL"
