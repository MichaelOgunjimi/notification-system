x-worker-common: &worker-common
  build:
    context: ./apps/api
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_started
  env_file:
    - .env
  environment: &worker-env
    POSTGRES_SERVER: db
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    REDIS_URL: redis://redis:6379/0
    EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    BACKEND_URL: https://beaco-api.michaelogunjimi.com
    FRONTEND_URL: https://beaco.michaelogunjimi.com
    CORS_ALLOWED_ORIGINS: http://localhost:3000 http://localhost:3001 https://beaco.michaelogunjimi.com https://beaco-docs.michaelogunjimi.com
  networks:
    - notification-net
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notification_system}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notification_system}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - notification-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - notification-net

  mailpit:
    image: axllent/mailpit:v1.31.0
    command: ["--database", "/data/mailpit.db"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpitdata:/data
    networks:
      - notification-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - .env
    environment:
      <<: *worker-env
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - notification-net

  worker-dispatcher:
    <<: *worker-common
    command: celery -A app.workers.celery_app worker -Q notifications.high,notifications.medium,notifications.low,notifications.reconciliation -l info -n dispatcher@%h --concurrency=4

  worker-email:
    <<: *worker-common
    command: celery -A app.workers.celery_app worker -Q notifications.email.high,notifications.email.medium,notifications.email.low -l info -n email@%h --concurrency=4

  worker-sms:
    <<: *worker-common
    command: celery -A app.workers.celery_app worker -Q notifications.sms.high,notifications.sms.medium,notifications.sms.low -l info -n sms@%h --concurrency=4

  worker-webhook:
    <<: *worker-common
    command: celery -A app.workers.celery_app worker -Q notifications.webhook.high,notifications.webhook.medium,notifications.webhook.low -l info -n webhook@%h --concurrency=4

  celery-beat:
    <<: *worker-common
    command: celery -A app.workers.celery_app beat -l info --schedule=/tmp/celerybeat-schedule

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FLOWER_PORT: ${FLOWER_PORT:-5555}
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    ports:
      - "${FLOWER_PORT:-5555}:${FLOWER_PORT:-5555}"
    networks:
      - notification-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BACKEND_URL: http://api:8000
        NEXT_PUBLIC_API_URL: https://beaco-api.michaelogunjimi.com/api/v1
        NEXT_PUBLIC_DOCS_URL: https://beaco-docs.michaelogunjimi.com
        NEXT_PUBLIC_SITE_URL: https://beaco.michaelogunjimi.com
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    environment:
      BACKEND_URL: http://api:8000
      NEXT_PUBLIC_API_URL: https://beaco-api.michaelogunjimi.com/api/v1
      NEXT_PUBLIC_DOCS_URL: https://beaco-docs.michaelogunjimi.com
      NEXT_PUBLIC_SITE_URL: https://beaco.michaelogunjimi.com
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - notification-net

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        NEXT_PUBLIC_WEB_URL: https://beaco.michaelogunjimi.com
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_WEB_URL: https://beaco.michaelogunjimi.com
    ports:
      - "${DOCS_PORT:-3001}:3001"
    networks:
      - notification-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    depends_on:
      - api
      - web
      - docs
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      - notification-net

volumes:
  pgdata:
  redisdata:
  mailpitdata:

networks:
  notification-net:
    driver: bridge
