x-worker-common: &worker-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file:
    - .env
  environment: &worker-env
    POSTGRES_SERVER: db
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    REDIS_URL: redis://redis:6379/0
  networks:
    - notification-net
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '1.0'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notification_system}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notification_system}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - notification-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - notification-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *worker-env
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - notification-net

  worker-dispatcher:
    <<: *worker-common
    command: celery -A app.workers.celery_app worker -Q notifications.high,notifications.medium,notifications.low -l info -n dispatcher@%h --concurrency=4

  worker-email:
    <<: *worker-common
    command: celery -A app.workers.celery_app worker -Q notifications.email -l info -n email@%h --concurrency=4

  worker-sms:
    <<: *worker-common
    command: celery -A app.workers.celery_app worker -Q notifications.sms -l info -n sms@%h --concurrency=4

  worker-webhook:
    <<: *worker-common
    command: celery -A app.workers.celery_app worker -Q notifications.webhook -l info -n webhook@%h --concurrency=4

volumes:
  pgdata:
  redisdata:

networks:
  notification-net:
    driver: bridge
