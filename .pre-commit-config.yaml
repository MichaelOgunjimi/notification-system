repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^apps/api/alembic/versions/
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: prettier
        name: prettier frontend format
        entry: ./node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: \.(cjs|css|html|js|json|jsx|md|mdx|mjs|scss|ts|tsx|yaml|yml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy type check
        entry: bash -c 'cd apps/api && uv run mypy app/'
        language: system
        pass_filenames: false
        files: ^apps/api/app/

      - id: pytest
        name: pytest
        entry: bash -c 'cd apps/api && uv run pytest -q'
        language: system
        pass_filenames: false
        files: ^apps/api/
